---
# Configuration shared throughout the promfriends role
promfriends_docker_host: "{{ansible_facts['fqdn']}}"
promfriends_docker_cacert_path: >
  {{lookup('env', 'HOME') + '/.docker/machines/machine/local/ca.pem'}}
promfriends_docker_key_path: >
  {{lookup('env', 'HOME') + '/.docker/machines/machine/local/key.pem'}}
promfriends_docker_cert_path: >
  {{lookup('env', 'HOME') + '/.docker/machines/machine/local/cert.pem'}}
promfriends_config_path: "/opt/prometheus/etc"
promfriends_bin_path: "/opt/prometheus/bin"
promfriends_cache_path: >-
  {{lookup('env', 'HOME') + '/.cache/ansible-promfriends'}}
promfriends_sites: {}
promfriends_certs_changed: false
promfriends_logdriver: "json-file"  # or journald
promfriends_logoptions: {}
promfriends_rule_configs: []
# Stale rule files remain active; disable only with another directory owner.
promfriends_rule_sweep: true
promfriends_extra_hosts: {}

# Configuration for Prometheus itself
prometheus_container_user: "docker"
prometheus_container_group: "docker"
prometheus_data_path: "/opt/prometheus/data"
prometheus_docker_name: "prometheus"
prometheus_version: "3.11.2"
prometheus_scrape_interval: "15s"
prometheus_scrape_timeout: "5s"
prometheus_retention_time: "336h"
prometheus_file_shrink_ratio: "0.1"
prometheus_log_level: "info"
# Preserve restored alert dwell for rules whose `for` is at least this long.
prometheus_for_grace_period: "10m"
prometheus_port: "9090"
prometheus_address: "0.0.0.0"
prometheus_scrapes:
  - job_name: "prometheus"
    scrape_interval: 60s
    scheme: "https"
    tls_config:
      ca_file: "/ca.crt"
      cert_file: "/server.crt"
      key_file: "/server.key"
      server_name: "{{inventory_hostname}}"
    static_configs:
      - targets: ["{{inventory_hostname}}:{{prometheus_port}}"]

prometheus_publish:
  - "{{prometheus_address}}:{{prometheus_port}}:{{prometheus_port}}"

# Configuration for SNMP Prometheus exporter
promsnmp_v2_community: "public"
promsnmp_v1_community: "public"
promsnmp_walk:
  - "1.3.6.1.2.1.1.3"
  - "1.3.6.1.2.1.2"
  - "1.3.6.1.2.1.25.2"
  - "1.3.6.1.2.1.31.1.1"
  - "1.3.6.1.4.1.2021.10.1.1"
  - "1.3.6.1.4.1.2021.10.1.2"
  - "1.3.6.1.4.1.2021.10.1.5"
  - "1.3.6.1.4.1.2021.11"
  - "1.3.6.1.4.1.2021.4"
promsnmp_oids: []

prombb_config: "blackbox.yml"
prombb_port: "9115"
prombb_version: "0.28.0"
prombb_log: "warn"
prombb_probe_log: "error"

prombb_publish:
  - "{{prometheus_address}}:{{prombb_port}}:{{prombb_port}}"

promnode_version: "1.11.1"
promnode_group: "prometheus"
promnode_binary_path: "/usr/local/bin"
promnode_cache_path: "{{promfriends_cache_path}}"
promnode_text_path: "/var/run/promnode/textfiles"
promnode_text_mode: "2775"

# tmpfiles requires canonical /run paths; producers join promnode_group.
promnode_run_text_path: "{{ promnode_text_path | regex_replace('^/var/run/', '/run/') }}"
promnode_run_path: "{{ promnode_run_text_path | dirname }}"
# This role is the sole owner of the textfile directory mode.
promnode_tmpfiles_conf: "/etc/tmpfiles.d/promnode.conf"

promnode_disabled:
  - "arp"
  - "bcache"
  - "bonding"
  - "btrfs"
  - "fibrechannel"
  - "infiniband"
  - "ipvs"
  - "netclass"
  - "nfs"
  - "nfsd"
  - "nvme"
  - "pressure"
  - "rapl"
  - "schedstat"
  - "selinux"
  - "tapestats"
  - "timex"
  - "udp_queues"
  - "xfs"
  - "zfs"
promnode_enabled:
  - textfile:
      directory: "{{promnode_text_path}}"
  - processes
promnode_port: 9100
promnode_running: true
promnode_startup: true
promnode_pkg_exporter: true
promnode_pkg_exporter_install_path: "/opt/promnode-pkg-exporter"
promnode_pkg_exporter_scheduler: "systemd"  # or `cron` (for legacy systems)
promnode_pkg_exporter_oncalendar: "*:0/15"
# Pin the schedule timezone so DST fall-back cannot skip an interval.
promnode_pkg_exporter_timezone: "UTC"
promnode_pkg_exporter_onactivesec: "1min"
promnode_pkg_exporter_accuracysec: "1min"
promnode_pkg_exporter_cron_minute: "0,15,30,45"
promnode_pkg_exporter_cron_hour: "*"
promnode_pkg_exporter_cron_day: "*"
promnode_pkg_exporter_cron_month: "*"
promnode_pkg_exporter_cron_weekday: "*"

# Report running-vs-newest kernel separately from reboot-required state.
promnode_kernel_metrics_install_path: "/usr/local/bin"
promnode_kernel_metrics_boot_dir: "/boot"
promnode_kernel_metrics_onbootsec: "30s"
promnode_kernel_metrics_oncalendar: "*:0/15"
promnode_kernel_metrics_accuracysec: "1min"

alertmanager_default_email: ""
alertmanager_email_enabled: "{{ alertmanager_default_email | default('', true) | length > 0 }}"
alertmanager_smtp_port: "465"

# Alertmanager requires a root receiver even without a delivery transport.
alertmanager_null_receiver: "nothing"
alertmanager_root_receiver: "{{ 'eeeemail' if alertmanager_email_enabled | bool else alertmanager_null_receiver }}"
alertmanager_receivers: []
alertmanager_routes: []
# Omit empty inhibit_rules; Alertmanager rejects null.
alertmanager_inhibit_rules: []
alertmanager_repeat_interval: "24h"
alertmanager_group_by:
  - "alertname"
alertmanager_version: "0.32.0"
alertmanager_data_path: "/opt/prometheus/alertmanager"
alertmanager_retention: "120h"
alertmanager_port: "9093"
alertmanager_external_url: "https://{{inventory_hostname}}:{{alertmanager_port}}"
alertmanager_publish:
  - "{{prometheus_address}}:{{alertmanager_port}}:{{alertmanager_port}}"

prometheus_alertmanager_targets:
  - "{{inventory_hostname}}:{{alertmanager_port}}"

# Optional Alertmanager HA clustering. When non-empty, the container gets
# --cluster.listen-address / --cluster.advertise-address plus one
# --cluster.peer per entry, and publishes the gossip port.
alertmanager_cluster_peers: []
alertmanager_cluster_port: "9094"
alertmanager_cluster_listen_address: "0.0.0.0:{{alertmanager_cluster_port}}"
alertmanager_cluster_advertise_address: "{{ansible_facts['default_ipv4']['address']}}:{{alertmanager_cluster_port}}"
alertmanager_cluster_publish:
  - "{{prometheus_address}}:{{alertmanager_cluster_port}}:{{alertmanager_cluster_port}}"
  - "{{prometheus_address}}:{{alertmanager_cluster_port}}:{{alertmanager_cluster_port}}/udp"

alertmanager_cluster_tls_enabled: false
alertmanager_cluster_tls_cert: "/server.crt"
alertmanager_cluster_tls_key: "/server.key"
alertmanager_cluster_tls_ca: "/ca.crt"
alertmanager_cluster_tls_server_name: ""
alertmanager_cluster_tls_volumes: []

# Upstream skips v0.58.x and v0.59.x.
cadvisor_version: "0.60.6"
cadvisor_port: "9980"
cadvisor_docker_group: "docker"

# cAdvisor is unauthenticated; keep it loopback-bound behind mTLS.
cadvisor_address: "127.0.0.1"
cadvisor_publish:
  - "{{cadvisor_address}}:{{cadvisor_port}}:{{cadvisor_port}}"
# Wildcard bind addresses are not valid readiness destinations.
cadvisor_health_host: >-
  {{ '127.0.0.1' if cadvisor_address in ['0.0.0.0', '::', ''] else cadvisor_address }}

cadvisor_docker_only: true
# Prevent arbitrary container labels from multiplying every metric series.
cadvisor_store_container_labels: false
cadvisor_housekeeping_interval: "10s"
cadvisor_max_housekeeping_interval: "60s"
# Both metric flags replace their defaults; `process` also requires host PID mode.
cadvisor_disable_metrics:
  - "advtcp"
  - "cpu_topology"
  - "cpuset"
  - "hugetlb"
  - "memory_numa"
  - "percpu"
  - "referenced_memory"
  - "resctrl"
  - "tcp"
  - "udp"

pushgateway_version: "1.11.2"
pushgateway_address: "{{prometheus_address}}"
pushgateway_port: "9091"
pushgateway_publish:
  - "{{pushgateway_address}}:{{pushgateway_port}}:{{pushgateway_port}}"
pushgateway_server_cert: "{{promfriends_config_path}}/server.crt"
pushgateway_server_key: "{{promfriends_config_path}}/server.key"
pushgateway_server_ca: "{{promfriends_config_path}}/ca.crt"
pushgateway_health_host: "{{inventory_hostname}}"
