---
# Configuration shared throughout the promfriends role
promfriends_docker_host: "{{ansible_facts['fqdn']}}"
promfriends_docker_cacert_path: >
  {{lookup('env', 'HOME') + '/.docker/machines/machine/local/ca.pem'}}
promfriends_docker_key_path: >
  {{lookup('env', 'HOME') + '/.docker/machines/machine/local/key.pem'}}
promfriends_docker_cert_path: >
  {{lookup('env', 'HOME') + '/.docker/machines/machine/local/cert.pem'}}
promfriends_config_path: "/opt/prometheus/etc"
promfriends_bin_path: "/opt/prometheus/bin"
promfriends_cache_path: >-
  {{lookup('env', 'HOME') + '/.cache/ansible-promfriends'}}
promfriends_sites: {}
promfriends_certs_changed: false
promfriends_logdriver: "json"  # or journald or whatever
promfriends_rule_configs: []

# Configuration for Prometheus itself
prometheus_container_user: "docker"
prometheus_container_group: "docker"
prometheus_data_path: "/opt/prometheus/data"
prometheus_docker_name: "prometheus"
prometheus_version: "3.11.2"
prometheus_scrape_interval: "15s"
prometheus_scrape_timeout: "5s"
prometheus_retention_time: "336h"
prometheus_file_shrink_ratio: "0.1"
prometheus_log_level: "info"
prometheus_port: "9090"
prometheus_address: "0.0.0.0"
prometheus_scrapes:
  - job_name: "prometheus"
    scrape_interval: 60s
    scheme: "https"
    tls_config:
      ca_file: "/ca.crt"
      cert_file: "/server.crt"
      key_file: "/server.key"
      server_name: "{{inventory_hostname}}"
    static_configs:
      - targets: ["{{inventory_hostname}}:{{prometheus_port}}"]

prometheus_publish:
  - "{{prometheus_address}}:{{prometheus_port}}:{{prometheus_port}}"

# Configuration for SNMP Prometheus exporter
promsnmp_v2_community: "public"
promsnmp_v1_community: "public"
promsnmp_walk:
  - "1.3.6.1.2.1.1.3"
  - "1.3.6.1.2.1.2"
  - "1.3.6.1.2.1.25.2"
  - "1.3.6.1.2.1.31.1.1"
  - "1.3.6.1.4.1.2021.10.1.1"
  - "1.3.6.1.4.1.2021.10.1.2"
  - "1.3.6.1.4.1.2021.10.1.5"
  - "1.3.6.1.4.1.2021.11"
  - "1.3.6.1.4.1.2021.4"
promsnmp_oids: []

promstatsd_ip: "127.0.0.1"

prombb_config: "blackbox.yml.j2"
prombb_port: "9115"
prombb_version: "0.28.0"
prombb_log: "warn"
prombb_probe_log: "error"

prombb_publish:
  - "{{prometheus_address}}:{{prombb_port}}:{{prombb_port}}"

promnode_version: "1.11.1"
promnode_group: "prometheus"
promnode_binary_path: "/usr/local/bin"
promnode_cache_path: "{{promfriends_cache_path}}"
promnode_text_path: "/var/run/promnode/textfiles"
promnode_disabled:
  - "arp"
  - "bcache"
  - "bonding"
  - "btrfs"
  - "fibrechannel"
  - "infiniband"
  - "ipvs"
  - "netclass"
  - "nfs"
  - "nfsd"
  - "nvme"
  - "pressure"
  - "rapl"
  - "schedstat"
  - "selinux"
  - "tapestats"
  - "timex"
  - "udp_queues"
  - "xfs"
  - "zfs"
promnode_enabled:
  - textfile:
      directory: "{{promnode_text_path}}"
  - processes
promnode_port: 9100
promnode_running: true
promnode_startup: true
promnode_pkg_exporter: true
promnode_pkg_exporter_install_path: "/opt/promnode-pkg-exporter"
promnode_pkg_exporter_scheduler: "systemd"  # or `cron` (for legacy systems)
promnode_pkg_exporter_oncalendar: "*:0/15"
promnode_pkg_exporter_cron_minute: "0,15,30,45"
promnode_pkg_exporter_cron_hour: "*"
promnode_pkg_exporter_cron_day: "*"
promnode_pkg_exporter_cron_month: "*"
promnode_pkg_exporter_cron_weekday: "*"

alertmanager_smtp_port: "465"
alertmanager_receivers: []
alertmanager_routes: []
alertmanager_repeat_interval: "24h"
alertmanager_group_by:
  - "alertname"
alertmanager_version: "0.32.0"
alertmanager_data_path: "/opt/prometheus/alertmanager"
alertmanager_retention: "120h"
alertmanager_port: "9093"
alertmanager_external_url: "https://{{inventory_hostname}}:{{alertmanager_port}}"
alertmanager_publish:
  - "{{prometheus_address}}:{{alertmanager_port}}:{{alertmanager_port}}"

cadvisor_version: "0.47.1"
cadvisor_port: "9980"
cadvisor_docker_group: "docker"

pushgateway_version: "1.11.2"
pushgateway_address: "{{prometheus_address}}"
pushgateway_port: "9091"
pushgateway_publish:
  - "{{pushgateway_address}}:{{pushgateway_port}}:{{pushgateway_port}}"
pushgateway_server_cert: "{{promfriends_config_path}}/server.crt"
pushgateway_server_key: "{{promfriends_config_path}}/server.key"
pushgateway_server_ca: "{{promfriends_config_path}}/ca.crt"
pushgateway_health_host: "{{inventory_hostname}}"
