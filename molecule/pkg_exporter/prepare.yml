---
# This scenario converges the same node context as the default scenario, so
# it needs that scenario's host setup (TLS assets, docker group) verbatim.
- import_playbook: ../default/prepare.yml

- name: Prepare pkg-exporter prerequisites
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # pkg-exporter imports `apt`, which is dpkg-shipped and cannot be
    # pip-installed. The role fails the converge when the venv cannot import
    # it, so a missing system package here would read as a role bug.
    - name: Install python3-apt
      ansible.builtin.apt:
        name:
          - python3-apt
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"
