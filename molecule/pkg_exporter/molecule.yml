---
dependency:
  name: galaxy
  options:
    force: true

driver:
  name: docker

platforms:
  - name: "promfriends-pkgexp-${MOLECULE_OS:-ubuntu}${MOLECULE_VERSION:-2404}"
    image: "geerlingguy/docker-${MOLECULE_OS:-ubuntu}${MOLECULE_VERSION:-2404}-ansible:latest"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    command: ${MOLECULE_DOCKER_COMMAND:-""}

provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible-${USER}/tmp/
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:${HOME}/.ansible/roles"

verifier:
  name: testinfra

scenario:
  # Repair a deliberately corrupted venv, then prove the repair settles.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - side_effect
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
