---
- block:
    - name: "check cadvisor container state"
      become: false
      delegate_to: "localhost"
      docker_container_info:
        name: "cadvisor"
        tls: true
        ca_cert: "{{promfriends_docker_cacert_path}}"
        client_key: "{{promfriends_docker_key_path}}"
        client_cert: "{{promfriends_docker_cert_path}}"
        tls_hostname: "{{promfriends_docker_tls_hostname|default(promfriends_docker_host)}}"
        validate_certs: true
        docker_host: "tcp://{{promfriends_docker_host}}:{{promfriends_docker_port|default(2376)}}"
      register: _cadvisor_info
      no_log: "{{ ansible_verbosity|int < 4 }}"
      when: _promfriends_docker_available|default(false)

    - name: "remove cadvisor container"
      become: false
      delegate_to: "localhost"
      docker_container:
        name: "cadvisor"
        docker_host: "tcp://{{promfriends_docker_host}}:{{promfriends_docker_port|default(2376)}}"
        ca_cert: "{{promfriends_docker_cacert_path}}"
        client_key: "{{promfriends_docker_key_path}}"
        client_cert: "{{promfriends_docker_cert_path}}"
        tls_hostname: "{{promfriends_docker_tls_hostname|default(promfriends_docker_host)}}"
        validate_certs: true
        state: "absent"
      when:
        - _promfriends_docker_available|default(false)
        - _cadvisor_info.exists|default(false)
  when: '"cadvisor" not in promfriends_contexts|default([])'

- block:
    - name: "get group id"
      getent:
        database: "group"
        key: "{{cadvisor_docker_group}}"

    - set_fact:
        cadvisor_docker_gid: "{{ansible_facts['getent_group'][cadvisor_docker_group][1]}}"

    - include_tasks: "docker.yml"
      vars:
        context: "cadvisor"
        image: "{{cadvisor_image}}"
        privileged: true
        user: "root"
        use_devices:
          - "/dev/kmsg:/dev/kmsg:ro"
        publish: "{{cadvisor_publish}}"
        use_pid_mode: "{{ cadvisor_pid_mode or omit }}"
        volume:
          - "/:/rootfs:ro"
          - "/run/docker.sock:/run/docker.sock:ro"
          - "/sys:/sys:ro"
          - "/var/lib/docker/:/var/lib/docker:ro"
          - "/dev/disk/:/dev/disk:ro"
          - "/sys/fs/cgroup:/sys/fs/cgroup:ro"
          - "/etc/machine-id:/etc/machine-id:ro"
        container_groups:
          - "{{cadvisor_docker_gid}}"
        use_command: "{{cadvisor_command}}"
        use_healthcheck: "{{cadvisor_healthcheck}}"

    - name: "ensure cadvisor container is running"
      uri:
        url: "http://{{cadvisor_health_host}}:{{cadvisor_port}}/healthz"
      register: cadvisor_status
      until: cadvisor_status.status == 200
      retries: 5
      delay: 10
  when: '"cadvisor" in promfriends_contexts|default([])'
