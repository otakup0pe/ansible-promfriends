---
- name: "validate pkg_exporter scheduler choice"
  ansible.builtin.assert:
    that:
      - promnode_pkg_exporter_scheduler in ["systemd", "cron"]
    fail_msg: >-
      promnode_pkg_exporter_scheduler must be 'systemd' or 'cron',
      got: {{ promnode_pkg_exporter_scheduler }}

- name: "ensure uv-managed venv for pkg-exporter (with system site-packages)"
  ansible.builtin.command:
    cmd: >-
      uv venv --system-site-packages
      {{promnode_pkg_exporter_install_path}}
    creates: "{{promnode_pkg_exporter_install_path}}/bin/python"

- name: "install pkg-exporter into the uv venv"
  ansible.builtin.command:
    cmd: >-
      uv pip install
      --python {{promnode_pkg_exporter_install_path}}/bin/python
      pkg-exporter
    creates: "{{promnode_pkg_exporter_install_path}}/bin/pkg-exporter"

- name: "deploy promnode pkg-exporter systemd service"
  ansible.builtin.template:
    src: "promnode-pkg-exporter.service.j2"
    dest: "/etc/systemd/system/promnode-pkg-exporter.service"
    owner: "root"
    group: "root"
    mode: "0644"
  register: promnode_pkg_exporter_service
  when: promnode_pkg_exporter_scheduler == "systemd"

- name: "deploy promnode pkg-exporter systemd timer"
  ansible.builtin.template:
    src: "promnode-pkg-exporter.timer.j2"
    dest: "/etc/systemd/system/promnode-pkg-exporter.timer"
    owner: "root"
    group: "root"
    mode: "0644"
  register: promnode_pkg_exporter_timer
  when: promnode_pkg_exporter_scheduler == "systemd"

- name: "reload systemd if pkg-exporter units changed"
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - promnode_pkg_exporter_scheduler == "systemd"
    - promnode_pkg_exporter_service.changed or promnode_pkg_exporter_timer.changed

- name: "enable and start promnode pkg-exporter timer"
  ansible.builtin.systemd:
    name: "promnode-pkg-exporter.timer"
    enabled: true
    state: "started"
  when: promnode_pkg_exporter_scheduler == "systemd"

- name: "restart promnode pkg-exporter timer if units changed"
  ansible.builtin.systemd:
    name: "promnode-pkg-exporter.timer"
    state: "restarted"
  when:
    - promnode_pkg_exporter_scheduler == "systemd"
    - promnode_pkg_exporter_service.changed or promnode_pkg_exporter_timer.changed

# scheduler == cron: install the cron entry, clean up systemd units.
- name: "install pkg-exporter cron entry"
  ansible.builtin.cron:
    name: "promfriend node pkg-exporter"
    minute: "{{ promnode_pkg_exporter_cron_minute }}"
    hour: "{{ promnode_pkg_exporter_cron_hour }}"
    day: "{{ promnode_pkg_exporter_cron_day }}"
    month: "{{ promnode_pkg_exporter_cron_month }}"
    weekday: "{{ promnode_pkg_exporter_cron_weekday }}"
    job: >-
      PKG_EXPORTER_FILE={{promnode_text_path}}/pkg-exporter.prom
      {{promnode_pkg_exporter_install_path}}/bin/pkg-exporter
  when: promnode_pkg_exporter_scheduler == "cron"

- name: "stop promnode pkg-exporter timer (scheduler != systemd)"
  ansible.builtin.systemd:
    name: "promnode-pkg-exporter.timer"
    state: "stopped"
    enabled: false
  failed_when: false
  when: promnode_pkg_exporter_scheduler != "systemd"

- name: "remove promnode pkg-exporter systemd units (scheduler != systemd)"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: "absent"
  loop:
    - "promnode-pkg-exporter.timer"
    - "promnode-pkg-exporter.service"
  register: promnode_pkg_exporter_units_removed
  when: promnode_pkg_exporter_scheduler != "systemd"

- name: "reload systemd after removing pkg-exporter units"
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - promnode_pkg_exporter_scheduler != "systemd"
    - promnode_pkg_exporter_units_removed.changed

# scheduler == systemd: legacy cleanup of any prior cron entry.
- name: "check for crontab binary"
  ansible.builtin.stat:
    path: "/usr/bin/crontab"
  register: promnode_pkg_exporter_crontab
  when: promnode_pkg_exporter_scheduler == "systemd"

- name: "remove legacy pkg-exporter cron entry (scheduler == systemd)"
  ansible.builtin.cron:
    name: "promfriend node pkg-exporter"
    state: "absent"
  when:
    - promnode_pkg_exporter_scheduler == "systemd"
    - promnode_pkg_exporter_crontab.stat.exists
